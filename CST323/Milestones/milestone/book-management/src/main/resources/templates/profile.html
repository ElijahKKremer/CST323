<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="https://www.thymeleaf.org/thymeleaf-extras-springsecurity6">
<head>
    <meta charset="UTF-8">
    <title>My Profile</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">LIBRARY</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/books}">Books</a></li>
                <li class="nav-item" sec:authorize="isAuthenticated()">
                    <a class="nav-link active" th:href="@{/profile}">My Borrowed Books</a>
                </li>
            </ul>
            <ul class="navbar-nav">
                <li class="nav-item dropdown" sec:authorize="isAuthenticated()">
                    <a class="nav-link dropdown-toggle" href="#" data-bs-toggle="dropdown">
                        <span sec:authentication="name"></span>
                    </a>
                    <ul class="dropdown-menu dropdown-menu-end">
                        <li>
                            <form th:action="@{/logout}" method="post" class="px-3">
                                <button type="submit" class="btn btn-link p-0">Logout</button>
                            </form>
                        </li>
                    </ul>
                </li>
                <li class="nav-item" sec:authorize="!isAuthenticated()">
                    <a class="nav-link" th:href="@{/login}">Login</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div class="container">

    <h2 class="mb-3">My Borrowed Books</h2>

    <p class="mb-3">
        Logged in as:
        <strong th:text="${user.username}"></strong>
        (<span th:text="${user.email}"></span>)
    </p>

    <table class="table table-striped table-bordered align-middle" th:if="${#lists.size(borrows) > 0}">
        <thead class="table-primary">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Borrowed On</th>
            <th style="width: 140px;">Actions</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="record : ${borrows}">
            <td th:text="${record.id}"></td>
            <td th:text="${record.book.title}"></td>
            <td th:text="${record.book.author}"></td>
            <td th:text="${record.borrowDate}"></td>
            <td>
                <form th:action="@{'/profile/return/' + ${record.id}}" method="post" style="display:inline;">
                    <button type="submit" class="btn btn-sm btn-warning">
                        Return
                    </button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <div class="alert alert-info" th:if="${#lists.size(borrows) == 0}">
        You have no active borrowed books.
    </div>

    <a th:href="@{/books}" class="btn btn-secondary mt-3">Back to Books</a>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
