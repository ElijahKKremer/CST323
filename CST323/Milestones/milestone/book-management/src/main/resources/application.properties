spring.datasource.url=jdbc:mysql://bookmanagement-db.mysql.database.azure.com:3306/bookmanagement?useSSL=true&requireSSL=false
spring.datasource.username=test
spring.datasource.password=pswcloud1!
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Expose only health and info endpoints
management.endpoints.web.exposure.include=health,info

# Show minimal health details (UP/DOWN only)
management.endpoint.health.show-details=never

# Optional: change base path for actuator endpoints
management.endpoints.web.base-path=/actuator

# Enable CORS if you want external monitors to access
management.endpoints.web.cors.allowed-origins=*
management.endpoints.web.cors.allowed-methods=GET